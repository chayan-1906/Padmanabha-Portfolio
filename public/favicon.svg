<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg-gradient-3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1"/>
        </linearGradient>
        <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1"/>
        </linearGradient>
    </defs>

    <!-- Terminal background -->
    <rect x="4" y="4" width="56" height="56" rx="8" ry="8" fill="url(#bg-gradient-3)" stroke="#475569" stroke-width="1"/>

    <!-- Terminal header dots -->
    <circle cx="14" cy="14" r="2" fill="#ef4444"/>
    <circle cx="22" cy="14" r="2" fill="#f59e0b"/>
    <circle cx="30" cy="14" r="2" fill="#10b981"/>

    <!-- Terminal prompt -->
    <text x="10" y="32" font-family="monospace" font-size="8" fill="#ffffff">></text>

    <!-- PD text -->
    <text x="18" y="32" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff">PD</text>

    <!-- Cursor -->
    <rect x="38" y="24" width="2" height="12" fill="#ffffff">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
</svg>